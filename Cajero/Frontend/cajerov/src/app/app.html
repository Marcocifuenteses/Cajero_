<div class="atm">

  <!-- Cabecera de la máquina -->
  <div class="header">
    <div class="logo">
      <div class="logo-dot"></div>
      Fintech
    </div>
    <div class="status-pill">En línea</div>
  </div>

  <!-- Ranura de tarjeta -->
  <div class="card-slot">
    <div class="card-slot-track"></div>
    <div class="card-slot-label">Inserte su tarjeta</div>
    <div class="card-slot-track"></div>
  </div>

  <!-- Bisel + Pantalla -->
  <div class="screen-bezel">
    <div class="screen">
      <router-outlet></router-outlet>
    </div>

    <!-- Cuenta regresiva: vive en el bisel inferior, fuera de la pantalla -->
    @if (countdown() !== null) {
      <div class="idle-countdown" [class.urgent]="(countdown() ?? 20) <= 7">
        <div class="idle-ring">
          <svg viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
            <circle class="idle-ring-bg" cx="18" cy="18" r="15.9"/>
            <circle class="idle-ring-fill" cx="18" cy="18" r="15.9"
                    [style.stroke-dashoffset]="ringOffset"/>
          </svg>
          <span class="idle-number">{{ countdown() }}</span>
        </div>
        <span class="idle-label">sesión</span>
      </div>
    }

  </div>

  <!-- Pie de la máquina -->
  <div class="footer">
    <span>ATM-0421 · GT-01</span>
    <span>FINTECH BANK</span>
    <span>
      @if (firstName) { {{ firstName }} } @else { 24H }
    </span>
  </div>

</div>
